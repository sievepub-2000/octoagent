[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/run/supervisord.pid
childlogdir=/var/log/supervisor

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[program:pg-bootstrap]
command=/pg-bootstrap.sh
user=root
autostart=true
autorestart=false
startretries=1
stdout_logfile=/var/log/supervisor/pg-bootstrap.log
stderr_logfile=/var/log/supervisor/pg-bootstrap.log

[program:postgres]
# Run the postmaster in the foreground so supervisord supervises the
# actual database process (pg_ctl start would exit after spawning it).
command=/usr/lib/postgresql/16/bin/postgres -D /var/lib/postgresql/data -c config_file=/var/lib/postgresql/data/postgresql.conf
user=postgres
autostart=true
autorestart=true
priority=100
startsecs=3
stopasgrp=true
killasgroup=true
stopsignal=INT
stopwaitsecs=30
stdout_logfile=/var/log/supervisor/postgres.log
stderr_logfile=/var/log/supervisor/postgres.log
environment=PGDATA="/var/lib/postgresql/data"

[program:system-executor]
command=bash -lc "cd /app/backend && /app/backend/.venv/bin/uvicorn src.system_executor.app:app --host 127.0.0.1 --port 19808"
user=root
autostart=true
autorestart=true
priority=200
startretries=30
stdout_logfile=/var/log/supervisor/system-executor.log
stderr_logfile=/var/log/supervisor/system-executor.log

[program:app-server]
command=bash -lc "cd /app/backend && /app/backend/.venv/bin/langgraph dev --no-browser --n-jobs-per-worker 4 --host 127.0.0.1 --port 19802 --no-reload"
user=octoagent
autostart=true
autorestart=true
priority=300
startretries=30
stdout_logfile=/var/log/supervisor/app-server.log
stderr_logfile=/var/log/supervisor/app-server.log

[program:frontend]
command=sh -c "PORT=19806 node /opt/frontend/server.js"
directory=/opt/frontend
user=octoagent
environment=HOSTNAME="0.0.0.0",PORT="19806",NODE_ENV="production",NEXT_TELEMETRY_DISABLED="1"
autostart=true
autorestart=true
priority=400
startretries=30
stdout_logfile=/var/log/supervisor/frontend.log
stderr_logfile=/var/log/supervisor/frontend.log

[program:nginx]
command=/usr/sbin/nginx -c /etc/nginx/nginx.allinone.conf -g "daemon off;"
user=root
autostart=true
autorestart=true
priority=500
startretries=30
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx.log