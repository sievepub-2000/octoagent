[project]
name = "octoagent"
version = "20260821"
description = "LangGraph-based AI agent system with sandbox execution capabilities"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "langchain>=1.2.3",
    "langchain-anthropic>=1.3.4",
    "langchain-deepseek>=1.0.1",
    "langchain-mcp-adapters>=0.3.2",
    # The latest official adapter still declares MCP <2; forcing mcp 2.0 breaks its RequestContext imports.
    "mcp>=1.29.0,<2.0.0",
    "langchain-openai>=1.1.7",
    "langgraph>=1.2.11",
    "langgraph-api>=0.12.4,<0.13.0",
    "langgraph-cli>=0.4.31",
    "langgraph-runtime-inmem>=0.32.4,<0.33.0",
    "markdownify>=1.2.2",
    "pydantic>=2.13.3",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0.3",
    "readabilipy>=0.3.0",
    "tavily-python>=0.7.17",
    "uvicorn[standard]>=0.34.0",
    "ddgs>=9.10.0",
    "duckdb>=1.4.4",
    "langchain-google-genai>=4.2.1",
    "slack-sdk>=3.33.0",
    "python-telegram-bot>=21.0",
    "langgraph-sdk>=0.1.51",
    "markdown-to-mrkdwn>=0.3.1",
    "Pillow>=12.2.0",
    "psutil>=7.2.2",
    # Security: pin vulnerable transitive deps to safe minimum versions
    "aiohttp>=3.13.4",
    "langchain-core>=1.2.28",
    "langgraph-checkpoint-postgres>=3.1.0",
    "psycopg[binary]>=3.3.4",
    "slowapi>=0.1.9",
    "patchright>=1.59.1",
    "markdown>=3.10.0",
    "python-docx>=1.2.0",
    "reportlab>=5.0.0",
    "python-dotenv>=1.2.1",
    "openpyxl>=3.1.5",
    "python-pptx>=1.0.2",
    "pypdf>=6.14.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.11",
    "bandit>=1.9.4",
    "httpx2>=2.9.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-m 'not live_ui' --import-mode=importlib"
markers = [
    "live_ui: tests that require a live frontend (deselected by default)",
]
filterwarnings = [
    "ignore:Call to deprecated method findAll.*:DeprecationWarning:readabilipy\\.simplifiers\\.html",
]
