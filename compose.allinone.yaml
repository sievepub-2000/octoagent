# OctoAgent all-in-one deployment: a single container running
# postgres + system-executor + app-server + frontend + nginx,
# coordinated by supervisord. Data volume is shared with the legacy
# 5-container stack (octoagent_postgres-data), so rollback is a
# simple "switch back to compose.yaml".
# NOTE: no build-arg proxies are passed on purpose. The base backend
# image bakes in host-proxy env vars; the all-in-one build needs direct
# outbound access, so compose must not re-inject proxy build args.
name: octoagent

services:
  octoagent:
    build:
      context: .
      dockerfile: docker/Dockerfile.allinone
      args:
        BACKEND_IMAGE: ${OCTOAGENT_BACKEND_IMAGE:-octoagent/backend:local}
        FRONTEND_IMAGE: ${OCTOAGENT_FRONTEND_IMAGE:-octoagent/frontend:local}
      extra_hosts:
        - "host.docker.internal:host-gateway"
    image: octoagent/all-in-one:${OCTOAGENT_IMAGE_TAG:-local}
    pull_policy: never
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      # Ports (defaults match the legacy stack; consumed by the nginx
      # template rendering in the entrypoint).
      OCTO_NGINX_PORT: ${OCTO_NGINX_PORT:-19800}
      OCTO_APP_SERVER_PORT: ${OCTO_APP_SERVER_PORT:-19802}
      OCTO_FRONTEND_PORT: ${OCTO_FRONTEND_PORT:-19806}
      POSTGRES_USER: octoagent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-octoagent}
      POSTGRES_DB: ${POSTGRES_DB:-octoagent}
      # In-container DSNs/URLs (loopback replaces the legacy service names).
      OCTOAGENT_CHECKPOINTER_DSN: postgresql://octoagent:${POSTGRES_PASSWORD:-octoagent}@127.0.0.1:5432/${POSTGRES_DB:-octoagent}?sslmode=disable
      OCTOAGENT_GATEWAY_INTERNAL_URL: http://127.0.0.1:19802
      OCTOAGENT_GATEWAY_HEALTH_URL: http://127.0.0.1:19802/health
      OCTOAGENT_OPENAPI_SPEC_URL: http://127.0.0.1:19802/openapi.json
      OCTO_LANGGRAPH_BASE_URL: http://127.0.0.1:19802
      OCTOAGENT_SYSTEM_EXECUTOR_URL: http://127.0.0.1:19808
      BETTER_AUTH_BASE_URL: http://localhost:${OCTO_NGINX_PORT:-19800}
      # Backend runtime env (mirror of the x-backend-env anchor in
      # compose.yaml; these are baked into the app-server service in the
      # legacy 5-container stack).
      CI: "true"
      PYTHONDONTWRITEBYTECODE: "1"
      OCTO_AGENT_CONFIG_PATH: /app/runtime/config/config.yaml
      OCTO_AGENT_EXTENSIONS_CONFIG_PATH: /app/runtime/config/extensions_config.json
      OCTO_AGENT_SETUP_STATE_FILE: /app/workspace/env/setup.json
      OCTO_AGENT_HOME: /app/workspace
      OCTOAGENT_MANAGED_SECRETS_FILE: /app/runtime/secrets/models.env
      OCTOAGENT_RUNTIME_CONFIG_DIR: /app/backend/runtime
      OCTOAGENT_APP_ROOT: /app
      OCTOAGENT_BACKEND_PATH: /app/backend
      PYTHONPATH: /app/backend
      OCTOAGENT_FILESYSTEM_ROOT: /app
      OCTOAGENT_PYTHON_BIN: /app/backend/.venv/bin/python
      OCTOAGENT_RUNTIME_PROFILE: production
      NPM_CONFIG_CACHE: /app/runtime/tools/npm-cache
      npm_config_cache: /app/runtime/tools/npm-cache
      OCTOAGENT_TOOL_GUIDE_PATH: /app/runtime/system_tools/copilot-instructions.md
      OCTOAGENT_POSTGRES_SUPERUSER_DSN: postgresql://octoagent:${POSTGRES_PASSWORD:-octoagent}@127.0.0.1:5432/${POSTGRES_DB:-octoagent}?sslmode=disable
      OCTOAGENT_HOST_REPO_ROOT: ${OCTOAGENT_HOST_REPO_ROOT:-/}
      OCTOAGENT_OPENROUTER_APP_URL: ${OCTOAGENT_OPENROUTER_APP_URL:-https://github.com/sievepub-2000/octoagent}
      OCTOAGENT_OPENROUTER_APP_TITLE: ${OCTOAGENT_OPENROUTER_APP_TITLE:-OctoAgent}
      OCTOAGENT_OPENROUTER_USAGE_INCLUDE: ${OCTOAGENT_OPENROUTER_USAGE_INCLUDE:-true}
      XDG_CACHE_HOME: /app/runtime/cache/xdg
      UV_CACHE_DIR: /app/runtime/cache/uv
      PIP_CACHE_DIR: /app/runtime/cache/pip
      PLAYWRIGHT_BROWSERS_PATH: /opt/patchright
      HF_HOME: /app/runtime/cache/huggingface
      SENTENCE_TRANSFORMERS_HOME: /app/runtime/cache/sentence_transformers
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      OCTO_APP_SERVER_JOBS: ${OCTO_APP_SERVER_JOBS:-4}
      OCTO_GATEWAY_PORT: ${OCTO_APP_SERVER_PORT:-19802}
      OCTO_LANGGRAPH_PORT: ${OCTO_APP_SERVER_PORT:-19802}
    ports:
      - "127.0.0.1:${OCTO_NGINX_PORT:-19800}:${OCTO_NGINX_PORT:-19800}"
    volumes:
      # PostgreSQL data: bind to the EXISTING volume from the 5-container
      # stack via an external reference so no new volume is ever created.
      - postgres-data:/var/lib/postgresql/data
      # Application runtime (same layout as the legacy app-server service).
      - ./runtime/config:/app/runtime/config
      - ./backend/runtime:/app/backend/runtime
      - ./workspace:/app/workspace
      - ./logs:/app/logs
      - ./tmp:/app/tmp
      - ./runtime/cache:/app/runtime/cache
      - ./runtime/logs:/app/runtime/logs
      - ./runtime/memory:/app/runtime/memory
      - ./runtime/langgraph:/app/backend/.langgraph_api
      - ./runtime/secrets:/app/runtime/secrets
      - ./runtime/system_tools:/app/runtime/system_tools
      - ./skills/custom:/app/skills/custom
      # Required by the in-container system executor (host docker CLI target).
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -m 5 http://127.0.0.1:${OCTO_NGINX_PORT:-19800}/health >/dev/null"]
      interval: 10s
      timeout: 8s
      retries: 90
      start_period: 90s

volumes:
  postgres-data:
    external:
      name: octoagent_postgres-data